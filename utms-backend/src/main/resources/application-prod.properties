# Production Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://db:5432/utmsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl-auto for Production
# update: Updates schema without dropping tables, preserves data
spring.jpa.hibernate.ddl-auto=update

# Disable H2 Console in Production
spring.h2.console.enabled=false

# Logging (Production-level)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator Configuration (Same as dev for monitoring)
management.endpoints.web.exposure.include=health,info,metrics,httpexchanges
management.endpoint.health.show-details=always
