# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:utmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate ddl-auto
# create-drop: Creates schema on startup, drops on shutdown.
spring.jpa.hibernate.ddl-auto=create-drop

# Initialization (Critical for data.sql to work with Hibernate properties)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
